<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Application Track</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <strong>Application Track</strong>
        <span id="version" class="version">v1.2.6</span>
      </div>
      <span class="signal">
        <span id="connection" class="dot" title="Not connected"></span>
        <span id="connection-label">Not connected</span>
      </span>
    </header>
    <p id="signal-detail" class="hint">The light is green when this extension can reach the server with your submitter account.</p>
    <p id="update" class="update" hidden></p>
    <p class="download">
      Download the latest extension
      <span id="latest" class="latest">Latest version</span>
      <a id="download" href="http://213.59.112.27:5000/api/extensions/application-track/download" target="_blank" rel="noopener noreferrer">http://213.59.112.27:5000/api/extensions/application-track/download</a>
    </p>

    <section id="setup">
      <label>
        Server
        <input id="api-url" type="url" value="http://213.59.112.27:5000" autocomplete="url" />
      </label>
      <label>
        Email
        <input id="email" type="email" autocomplete="username" />
      </label>
      <label>
        Password
        <input id="password" type="password" autocomplete="current-password" />
      </label>
      <button id="sign-in" type="button">Sign in</button>
      <p id="setup-status" class="status"></p>
    </section>

    <section id="main" hidden>
      <p id="who" class="hint"></p>
      <p id="watching" class="hint">Waiting for an application form.</p>
      <p id="last" class="status"></p>
      <button id="sign-out" class="text" type="button">Sign out</button>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
